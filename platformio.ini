[env:esp32dev]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino

board_build.partitions = huge_app.csv
monitor_speed = 115200

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Iinclude
    -std=gnu++17

lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9

lib_ldf_mode = deep+
